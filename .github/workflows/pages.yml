name: Publish WebPharm demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore complete site
        run: |
          cat site.zip.part* > /tmp/site.zip
          echo "8e28cc6b3b53a7e787dc9849a0a9c7e6aded3b44ae13aa1ea82d96436c1e3bc5  /tmp/site.zip" | sha256sum --check
          mkdir _site
          unzip -q /tmp/site.zip -d _site
          test -f _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
